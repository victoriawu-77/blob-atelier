<style>
:root{--bg:#F4F3F0;--ink:#1D1D1F;--mute:#8A8A90;--line:rgba(0,0,0,.07);--panel:#FFFFFF;--tile:#F5F5F7;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:1fr 360px;height:100vh;min-height:620px}
.stage{position:relative;overflow:hidden;background:radial-gradient(60% 55% at 50% 46%,#FFFFFF 0%,rgba(255,255,255,0) 70%),var(--bg)}
.brand{position:absolute;left:32px;top:28px;display:flex;align-items:baseline;gap:10px;user-select:none}
.brand b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.brand span{color:var(--mute);font-size:13px}
.credit{position:absolute;left:32px;bottom:24px;z-index:2;display:flex;flex-direction:column;gap:5px;color:#55555B;font-size:14.5px;line-height:1.2;letter-spacing:-.005em}
.credit .made{display:flex;align-items:center;gap:7px}
.credit a{color:#1D1D1F;text-decoration:none;transition:opacity .2s var(--ease),text-decoration-color .2s var(--ease)}
.credit .hc{display:inline-flex;padding:2px 0;border-radius:6px}
.credit .hc:hover{opacity:.62}
.credit .hc:focus-visible,.credit .by a:focus-visible{outline:2px solid #1D1D1F;outline-offset:3px}
.hc-logo{height:18px;width:auto;display:block;transform:translateY(1px)}
.credit .by a{font-weight:560;text-decoration:underline;text-decoration-color:rgba(29,29,31,.38);text-underline-offset:3px;text-decoration-thickness:1.5px}
.credit .by a:hover{text-decoration-color:#1D1D1F}
.credit .heart{margin-left:4px;font-size:.95em}
.topbar{position:absolute;right:28px;top:20px;z-index:3;display:flex;align-items:center;gap:10px}
.share{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#1D1D1F;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 8px rgba(30,20,60,.06);transition:transform .2s var(--ease),box-shadow .2s}
.share:hover{box-shadow:0 0 0 1px rgba(0,0,0,.14),0 4px 14px rgba(30,20,60,.1)}
.share:active{transform:scale(.94)}
.share svg{width:18px;height:18px}
.share .tip{position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,-4px);white-space:nowrap;background:#1D1D1F;color:#fff;font:500 12.5px/1 -apple-system,BlinkMacSystemFont,"Inter",sans-serif;font-style:normal;padding:8px 11px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .25s var(--ease)}
.share .tip.show{opacity:1;transform:translate(-50%,0)}
.rnd{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 18px 0 15px;border:0;border-radius:999px;background:#1D1D1F;color:#fff;font:inherit;font-size:14px;font-weight:560;letter-spacing:-.005em;cursor:pointer;box-shadow:0 6px 18px rgba(29,29,31,.2),0 1px 2px rgba(29,29,31,.2);transition:transform .2s var(--ease),background .2s,box-shadow .2s}
.rnd:hover{background:#000;box-shadow:0 8px 22px rgba(29,29,31,.26),0 1px 2px rgba(29,29,31,.2)}
.rnd:active{transform:scale(.96)}
.rnd svg{width:18px;height:18px;flex:none;transition:transform .45s var(--ease)}
.rnd:hover svg{transform:rotate(-14deg)}
.rnd .l-short{display:none}
.hint{position:absolute;right:32px;bottom:28px;color:#A1A1A7;font-size:12.5px}
#stage{position:absolute;left:50%;top:46%;width:min(62vh,58vw);height:min(62vh,58vw);transform:translate(-50%,-50%)}
.states{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 8px 30px rgba(30,20,60,.08),0 0 0 1px rgba(0,0,0,.04)}
.states button{border:0;background:transparent;font:inherit;font-size:13px;color:#55555B;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .25s var(--ease),color .25s var(--ease)}
.states button:hover{color:var(--ink)}
.states button.on{background:var(--ink);color:#fff}
.panel{background:var(--panel);border-left:1px solid var(--line);padding:26px 24px 20px;overflow:auto;display:flex;flex-direction:column;gap:22px}
.sec h3{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;gap:8px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.tile{position:relative;border:0;background:var(--tile);border-radius:14px;padding:4px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s}
.tile:hover{background:#EFEFF2}
.tile:active{transform:scale(.96)}
.tile agent-mascot{width:62px;height:62px;pointer-events:none}
.tile small{font-size:11px;color:#6E6E73;margin-top:-4px}
.tile.on{background:#fff;box-shadow:0 0 0 1.5px var(--ink),0 6px 16px rgba(0,0,0,.06)}
.g3 .tile agent-mascot{width:70px;height:70px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .2s var(--ease),box-shadow .2s}
.sw button:hover{transform:scale(1.1)}
.sw button.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 0 0 2.5px #fff,0 0 0 4px var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--tile);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;padding:6px 14px;border-radius:8px;color:#55555B;cursor:pointer;transition:all .2s var(--ease)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toggle{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:#55555B;cursor:pointer;user-select:none}
.toggle i{width:34px;height:20px;border-radius:999px;background:#E3E3E8;position:relative;transition:background .25s var(--ease)}
.toggle i:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.toggle.on i{background:#34C759}.toggle.on i:after{transform:translateX(14px)}
.btn{border:0;font:inherit;font-size:13.5px;cursor:pointer;border-radius:12px;padding:11px 14px;transition:transform .2s var(--ease),background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.ghost{background:var(--tile);color:var(--ink)}
.ghost:hover{background:#ECECEF}
.ex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ex .btn{padding:9px 0}
.embed{width:100%;margin-top:8px}
.api{font:11.5px/1.5 ui-monospace,Menlo,monospace;color:var(--mute);margin-top:auto;padding-top:6px}
.toast{position:fixed;left:calc(50% - 180px);top:24px;transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:all .35s var(--ease);pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- embed modal ---------- */
.mb{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(28,26,34,.26);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility 0s linear .28s}
.mb.open{opacity:1;visibility:visible;transition:opacity .28s var(--ease)}
.modal{position:relative;width:min(764px,100%);max-height:min(880px,calc(100vh - 48px));max-height:min(880px,calc(100dvh - 48px));overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:32px;padding:44px 32px 32px;box-shadow:0 30px 80px rgba(30,20,50,.18),0 0 0 1px rgba(0,0,0,.04);transform:translateY(14px) scale(.98);transition:transform .34s var(--ease)}
.mb.open .modal{transform:none}
.mh{display:flex;align-items:center;gap:18px;padding:0 64px 0 12px;margin-bottom:26px}
.mh agent-mascot{width:76px;height:76px;margin:-8px -6px -8px -10px;flex:none;pointer-events:none}
.mh h2{margin:0;font-size:21px;font-weight:650;letter-spacing:-.015em;line-height:1.25}
.mh p{margin:4px 0 0;color:#86868B;font-size:15px;line-height:1.35}
.mx{position:absolute;right:30px;top:52px;width:42px;height:42px;border-radius:50%;border:0;background:#F2F2F4;color:#1D1D1F;cursor:pointer;display:grid;place-items:center;transition:background .2s}
.mx:hover{background:#E8E8EC}
.mx svg{width:14px;height:14px}
.tabs{display:inline-flex;background:#F2F2F4;border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{border:0;background:transparent;font:inherit;font-size:15px;color:#55555B;padding:8px 15px;border-radius:10px;cursor:pointer;min-height:36px;transition:all .2s var(--ease)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:550;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cb{position:relative;background:#F5F3EF;border:1px solid rgba(60,40,20,.07);border-radius:20px;margin-bottom:16px}
.cb pre{margin:0;padding:20px 104px 20px 22px;font:13.5px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#3A3A3F;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.cb .cp{position:absolute;right:12px;top:12px;border:0;background:#fff;color:#1D1D1F;font:inherit;font-size:14px;font-weight:600;padding:9px 16px;min-width:72px;min-height:42px;border-radius:13px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.05);transition:background .2s,transform .15s}
.cb .cp:hover{background:#FAFAFA}.cb .cp:active{transform:scale(.96)}
.cb .cp.ok{color:#1F8F4E}
.tk-t{color:#C4314B}.tk-a{color:#3B5BC6}.tk-s{color:#3C8A4F}.tk-c{color:#9A9AA0}.tk-k{color:#C4314B}.tk-f{color:#3B5BC6}
.cb .note{padding:0 22px 16px;margin-top:-8px;color:#9A9AA0;font-size:12.5px}
.cb .note a{color:#6E6E73}
.mf{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:4px}
.dl{border:0;background:#F2F2F4;color:#1D1D1F;font:inherit;font-size:15px;font-weight:600;padding:12px 18px;min-height:44px;border-radius:14px;cursor:pointer;transition:background .2s,transform .15s}
.dl:hover{background:#E8E8EC}.dl:active{transform:scale(.97)}
.mf span{color:#86868B;font-size:14px}
body.lock{overflow:hidden}
/* ---------- theme toggle ---------- */
.theme svg{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;transition:transform .5s var(--ease),opacity .3s var(--ease)}
.theme .i-sun{opacity:0;transform:rotate(-90deg) scale(.5)}
html[data-theme=dark] .theme .i-moon{opacity:0;transform:rotate(90deg) scale(.5)}
html[data-theme=dark] .theme .i-sun{opacity:1;transform:none}
html.theming,html.theming *{transition:background-color .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),box-shadow .35s var(--ease),text-decoration-color .35s var(--ease)!important}
html.theming .theme svg{transition:transform .5s var(--ease),opacity .3s var(--ease)!important}
html[data-theme=light]{color-scheme:light}
/* ---------- dark mode ---------- */
html[data-theme=dark]{color-scheme:dark;--bg:#141413;--ink:#EDEBE6;--mute:#8C8A84;--line:rgba(255,255,255,.07);--panel:#1E1E1C;--tile:#262624}
html[data-theme=dark] agent-mascot{--am-shadow:#000;--am-shadow-opacity:.62}
html[data-theme=dark] .stage{background:radial-gradient(58% 52% at 50% 46%,#2C2B28 0%,rgba(44,43,40,0) 72%),var(--bg)}
html[data-theme=dark] .credit{color:#9E9C96}
html[data-theme=dark] .credit a{color:#EDEBE6}
html[data-theme=dark] .credit .by a{text-decoration-color:rgba(237,235,230,.4)}
html[data-theme=dark] .credit .by a:hover{text-decoration-color:#EDEBE6}
html[data-theme=dark] .credit .hc:focus-visible,html[data-theme=dark] .credit .by a:focus-visible{outline-color:#EDEBE6}
html[data-theme=dark] .share{background:#242422;color:#EDEBE6;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 2px 10px rgba(0,0,0,.3)}
html[data-theme=dark] .share:hover{background:#2A2A28;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 4px 14px rgba(0,0,0,.4)}
html[data-theme=dark] .share .tip,html[data-theme=dark] .toast{background:#F2F0EB;color:#141413}
html[data-theme=dark] .rnd{background:#F2F0EB;color:#141413;box-shadow:0 6px 20px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3)}
html[data-theme=dark] .rnd:hover{background:#fff}
html[data-theme=dark] .hint{color:#6B6964}
html[data-theme=dark] .states{background:rgba(36,36,34,.74);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 30px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)}
html[data-theme=dark] .states button{color:#A4A29C}
html[data-theme=dark] .states button:hover{color:#EDEBE6}
html[data-theme=dark] .states button.on{background:#EDEBE6;color:#141413}
html[data-theme=dark] .tile:hover{background:#2D2D2A}
html[data-theme=dark] .tile small{color:#A09E98}
html[data-theme=dark] .tile.on{background:#30302D;box-shadow:0 0 0 1.5px #EDEBE6,0 6px 18px rgba(0,0,0,.35)}
html[data-theme=dark] .sw button{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
html[data-theme=dark] .sw button[data-v=ink],html[data-theme=dark] .sw button[data-v=cocoa]{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.26)}
html[data-theme=dark] .sw button.on{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 0 0 2.5px var(--panel),0 0 0 4px #EDEBE6}
html[data-theme=dark] .sw button[data-v=ink].on{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.26),0 0 0 2.5px var(--panel),0 0 0 4px #EDEBE6}
html[data-theme=dark] .seg button{color:#A4A29C}
html[data-theme=dark] .seg button.on{background:#3A3A37;color:#EDEBE6;box-shadow:0 1px 3px rgba(0,0,0,.4)}
html[data-theme=dark] .toggle{color:#A4A29C}
html[data-theme=dark] .toggle i{background:#3A3A37}
html[data-theme=dark] .toggle i:after{background:#F5F3EE}
html[data-theme=dark] .toggle.on i{background:#30C060}
html[data-theme=dark] .ghost:hover{background:#2E2E2B}
html[data-theme=dark] .mb{background:rgba(8,8,7,.55)}
html[data-theme=dark] .modal{background:#1E1E1C;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07)}
html[data-theme=dark] .mh p,html[data-theme=dark] .mf span{color:#8C8A84}
html[data-theme=dark] .mx,html[data-theme=dark] .tabs,html[data-theme=dark] .dl{background:#2A2A28;color:#EDEBE6}
html[data-theme=dark] .mx:hover,html[data-theme=dark] .dl:hover{background:#333330}
html[data-theme=dark] .tabs button{color:#A4A29C}
html[data-theme=dark] .tabs button.on{background:#3A3A37;color:#EDEBE6;box-shadow:0 1px 3px rgba(0,0,0,.4)}
html[data-theme=dark] .cb{background:#161615;border-color:rgba(255,255,255,.06)}
html[data-theme=dark] .cb pre{color:#D6D3CC}
html[data-theme=dark] .cb .cp{background:#2A2A28;color:#EDEBE6;box-shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.08)}
html[data-theme=dark] .cb .cp:hover{background:#333330}
html[data-theme=dark] .cb .cp.ok{color:#6FD69A}
html[data-theme=dark] .tk-t,html[data-theme=dark] .tk-k{color:#FF8496}
html[data-theme=dark] .tk-a,html[data-theme=dark] .tk-f{color:#93B4FF}
html[data-theme=dark] .tk-s{color:#97D89E}
html[data-theme=dark] .tk-c{color:#76746E}
html[data-theme=dark] .cb .note{color:#76746E}
html[data-theme=dark] .cb .note a{color:#A4A29C}
@media (max-width:820px){ html[data-theme=dark] .panel{box-shadow:0 -12px 40px rgba(0,0,0,.4),0 -1px 0 rgba(255,255,255,.06)} }
/* ---------- tablet + phone: stacked layout, panel as a bottom sheet ---------- */
@media (max-width:820px){
  .app{display:block;height:auto;min-height:0}
  .stage{display:flex;flex-direction:column;align-items:center;padding:76px 16px 22px;overflow:visible}
  .brand{left:20px;top:24px}
  .topbar{right:16px;top:18px;gap:8px}
  .rnd{min-height:40px}
  #stage{position:relative;left:auto;top:auto;transform:none;width:min(80vw,44vh,380px);height:min(80vw,44vh,380px);flex:none;margin:6px 0 4px}
  .states{position:relative;left:auto;bottom:auto;transform:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:440px;border-radius:22px;padding:5px;margin-top:14px}
  .states button{min-height:40px;padding:8px 4px;font-size:13.5px}
  .credit{position:relative;left:auto;bottom:auto;align-self:flex-start;margin:22px 4px 2px;font-size:14px}
  .credit .hc,.credit .by a{position:relative}
  .credit .hc:after,.credit .by a:after{content:"";position:absolute;inset:-10px -6px}
  .hc-logo{height:16.5px}
  .hint{display:none}
  .toast{left:50%}
  .panel{border-left:0;border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(30,20,60,.06),0 -1px 0 var(--line);padding:26px max(20px,calc((100% - 600px)/2)) calc(28px + env(safe-area-inset-bottom));gap:24px;overflow:visible}
  .sw{gap:12px}
  .sw button{width:34px;height:34px;position:relative}
  .sw button:after{content:"";position:absolute;inset:-5px;border-radius:50%}
  .seg button{min-height:40px;padding:8px 18px;font-size:14px}
  .toggle{min-height:40px;font-size:14px}
  .btn{min-height:46px;font-size:14.5px}
  .tile small{font-size:12px}
  .api{text-align:center;padding-top:0}
}
@media (max-width:520px){
  .brand{flex-direction:column;gap:2px;top:19px}
  .brand b{font-size:16.5px}.brand span{font-size:12.5px}
  .rnd{padding:0 15px 0 13px;gap:7px;font-size:13.5px}
  .rnd .l-full{display:none}.rnd .l-short{display:inline}
}

  clay:['milk','peach','butter','matcha','sky','lilac','cocoa','tangerine'], velvet:['peach','bubblegum','lilac','matcha','cocoa','tangerine','butter','sky','ink'] };
var CURATED=[['mochi','peach','jelly','dot'],['bean','lilac','velvet','capsule'],['pebble','milk','clay','dot'],['squircle','ink','matte','capsule'],['pill','sky','glass','capsule'],['drop','mint','soft','dot'],['kitty','butter','clay','dot'],['cloud','bubblegum','jelly','dot'],['mochi','matcha','velvet','dot'],['cloud','sky','glass','dot']];
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function randomize(){
  var c;
  for(var tries=0;tries<20;tries++){
    if(Math.random()<0.3){ var q=pick(CURATED); c={shape:q[0],color:q[1],material:q[2],eyes:q[3]}; }
    else { var m=pick(['jelly','jelly','soft','clay','velvet','glass','matte','soft']); c={material:m,color:pick(TASTE[m]),shape:pick(AM.SHAPES)};
      c.eyes = (['pill','bean','drop'].indexOf(c.shape)>=0 ? Math.random()<0.7 : Math.random()<0.25) ? 'capsule':'dot'; }
    c.cheeks = ['ink','cocoa'].indexOf(c.color)<0 && Math.random()<0.7;
    if(c.shape!==state.shape || c.color!==state.color || c.material!==state.material) break;
  }
  set(c); stage.poke();
}
$('rand').onclick=randomize;
// theme
var THEME_KEY='blob-atelier-theme', mqDark=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function curTheme(){ return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'; }
function applyTheme(t,animate){ var d=document.documentElement; if(animate){ d.classList.add('theming'); clearTimeout(applyTheme.t); applyTheme.t=setTimeout(function(){ d.classList.remove('theming'); },450); }
  d.setAttribute('data-theme',t); var c=t==='dark'?'#141413':'#F4F3F0'; document.querySelectorAll('meta[name=theme-color]').forEach(function(m){ m.setAttribute('content',c); });
  var lbl=t==='dark'?'Light mode':'Dark mode', b=$('theme'); b.setAttribute('aria-label',lbl); b.title=lbl; b.setAttribute('aria-pressed',t==='dark'?'true':'false'); }
applyTheme(curTheme(),false);
$('theme').onclick=function(){ var t=curTheme()==='dark'?'light':'dark'; try{ localStorage.setItem(THEME_KEY,t); }catch(e){} applyTheme(t,true); };
if(mqDark){ var onSys=function(e){ var saved=null; try{ saved=localStorage.getItem(THEME_KEY); }catch(_){} if(saved!=='light'&&saved!=='dark') applyTheme(e.matches?'dark':'light',true); }; mqDark.addEventListener?mqDark.addEventListener('change',onSys):mqDark.addListener(onSys); }
// share
var tipT; function shareTip(msg){ var t=$('shareTip'); t.textContent=msg; t.classList.add('show'); clearTimeout(tipT); tipT=setTimeout(function(){ t.classList.remove('show'); },1600); }
function shareURL(){ writeHash(); return location.href.replace(/^file:\/\/[^#]*/, 'https://victoriawu-77.github.io/blob-atelier/'); }
$('share').onclick=function(){ var url=shareURL(), data={title:'Blob Atelier',text:'I made my AI agent a mascot ✨',url:url};
  var native=navigator.share && (!navigator.canShare || navigator.canShare(data)) && matchMedia('(pointer:coarse), (max-width:820px)').matches;
  if(native){ navigator.share(data).catch(function(err){ if(err && err.name!=='AbortError') copyText(url).then(function(){ shareTip('Link copied'); }); }); return; }
  copyText(url).then(function(){ window.__lastCopy=url; shareTip('Link copied'); }); };
document.addEventListener('keydown',function(e){ if(e.target.tagName==='INPUT'||document.body.classList.contains('lock')) return; if(e.key==='r'||e.key==='R') randomize(); if(e.key===' '){ e.preventDefault(); stage.poke(); } });
// toast
var tt; function toast(s,ms){ var t=$('toast'); t.textContent=s; t.classList.add('show'); clearTimeout(tt); if(ms!==0) tt=setTimeout(function(){ t.classList.remove('show'); },ms||1600); }
// export
function fname(ext){ return 'blob-'+state.shape+'-'+state.color.replace('#','')+'-'+state.material+'.'+ext; }
function download(blob,name){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); }
function svgImg(str){ return new Promise(function(res,rej){ var i=new Image(); i.onload=function(){ res(i); }; i.onerror=rej; i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str); }); }
function toBlob(cv,type,q){ return new Promise(function(r){ cv.toBlob(r,type,q); }); }
var EX={
  svg: async function(){ return new Blob([stage.toSVGString(1024)],{type:'image/svg+xml'}); },
  png: async function(size){ size=size||1024; var img=await svgImg(stage.toSVGString(size)); var cv=document.createElement('canvas'); cv.width=cv.height=size; cv.getContext('2d').drawImage(img,0,0,size,size); return toBlob(cv,'image/png'); },
  frames: async function(fps,secs,size,each){ var was=AM.manual; AM.manual=true; var n=Math.round(fps*secs);
    try{ for(var i=0;i<n;i++){ stage.step(1/fps); var img=await svgImg(stage.toSVGString(size,BG)); await each(img,i,n); } } finally { AM.manual=was; } },
  gif: async function(opts){ opts=opts||{}; var size=opts.size||480, fps=opts.fps||25, secs=opts.secs||3.2;
    var G=await import('https://unpkg.com/gifenc@1.0.3/dist/gifenc.esm.js'); var enc=G.GIFEncoder(); var cv=document.createElement('canvas'); cv.width=cv.height=size; var ctx=cv.getContext('2d',{willReadFrequently:true});
    await EX.frames(fps,secs,size,function(img,i,n){ ctx.fillStyle=BG; ctx.fillRect(0,0,size,size); ctx.drawImage(img,0,0,size,size); var d=ctx.getImageData(0,0,size,size).data; var pal=G.quantize(d,256); var idx=G.applyPalette(d,pal); enc.writeFrame(idx,size,size,{palette:pal,delay:Math.round(1000/fps)}); if(opts.progress) opts.progress(i/n); });
    enc.finish(); return new Blob([enc.bytes()],{type:'image/gif'}); },
  webm: async function(opts){ opts=opts||{}; var size=opts.size||720, fps=opts.fps||30, secs=opts.secs||4;
    var cv=document.createElement('canvas'); cv.width=cv.height=size; var ctx=cv.getContext('2d'); ctx.fillStyle=BG; ctx.fillRect(0,0,size,size);
    var stream=cv.captureStream(0), track=stream.getVideoTracks()[0]; var mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].filter(function(m){ return MediaRecorder.isTypeSupported(m); })[0];
    var rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6}), chunks=[]; rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
    var done=new Promise(function(r){ rec.onstop=r; }); rec.start(); var t0=performance.now();
    await EX.frames(fps,secs,size,async function(img,i,n){ ctx.fillStyle=BG; ctx.fillRect(0,0,size,size); ctx.drawImage(img,0,0,size,size); track.requestFrame && track.requestFrame(); if(opts.progress) opts.progress(i/n);
      var wait=t0+(i+1)*1000/fps-performance.now(); if(wait>0) await new Promise(function(r){ setTimeout(r,wait); }); });
    rec.stop(); await done; return new Blob(chunks,{type:'video/webm'}); }
};
window.__exports=EX;
document.querySelectorAll('[data-x]').forEach(function(b){ b.onclick=async function(){ var x=b.dataset.x; b.disabled=true; try{
  if(x==='svg') download(await EX.svg(),fname('svg'));
  if(x==='png') download(await EX.png(),fname('png'));
  if(x==='gif'){ toast('Rendering GIF…',0); download(await EX.gif({progress:function(p){ toast('Rendering GIF… '+Math.round(p*100)+'%',0); }}),fname('gif')); }
  if(x==='webm'){ toast('Recording WebM…',0); download(await EX.webm({progress:function(p){ toast('Recording WebM… '+Math.round(p*100)+'%',0); }}),fname('webm')); }
  toast('Exported '+x.toUpperCase()); } catch(err){ console.warn(err); toast('Export failed: '+(err&&err.message||err)); } b.disabled=false; }; });
// embed
var SRC=$('agent-mascot-src').textContent.trim(), SRC_KB=(new Blob([SRC]).size/1024).toFixed(1), HOSTED='https://victoriawu-77.github.io/blob-atelier/agent-mascot.js';
function attrs(){ var c=state; return [['shape',c.shape],['color',c.color],['material',c.material],['eyes',c.eyes],['cheeks',c.cheeks?'true':'false'],['state',c.state]]; }
function tag(){ return '<agent-mascot '+attrs().map(function(a){ return a[0]+'="'+a[1]+'"'; }).join(' ')+'></agent-mascot>'; }
function standalone(){ return '<script>\n'+SRC+'\n<\/script>\n'+tag(); }
function scriptTag(){ return '<script src="agent-mascot.js"><\/script>\n'+tag(); }
window.__embed={tag:tag,standalone:standalone,scriptTag:scriptTag,src:function(){ return SRC; }};
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function sp(cls,s){ return '<span class="tk-'+cls+'">'+esc(s)+'</span>'; }
function hTag(){ return sp('t','<agent-mascot')+attrs().map(function(a){ return ' '+sp('a',a[0])+'='+sp('s','"'+a[1]+'"'); }).join('')+sp('t','></agent-mascot>'); }
function hJS(code){ return code.split('\n').map(function(line){ var out='', re=/(\/\/.*$)|('[^']*')|\b(const|let|new|return)\b|\.([A-Za-z_]\w*)(?=\()|([^'\/.]+|.)/g, m;
  while((m=re.exec(line))){ if(m[1]) out+=sp('c',m[1]); else if(m[2]) out+=sp('s',m[2]); else if(m[3]) out+=sp('k',m[3]); else if(m[4]) out+='.'+sp('f',m[4]); else out+=esc(m[5]); } return out; }).join('\n'); }
var API=["const mascot = document.querySelector('agent-mascot');","","mascot.setState('thinking');","// "+AM.STATES.join(' · '),"","mascot.addEventListener('poke', () => mascot.setState('happy'));","mascot.poke();                     // squish it from code","mascot.setConfig({ color: 'mint', shape: 'kitty' });","mascot.lookAt(0.5, -0.3);          // hold the gaze; null to release","const svg = mascot.toSVGString(512); // still frame as an SVG string","","// size it with CSS like any element:","// agent-mascot { width: 160px; height: 160px; }"].join('\n');
var tab='single', modalOpen=false, lastFocus=null;
function renderEmbed(){
  $('snipCode').innerHTML = tab==='single'
    ? sp('t','<script>')+sp('c','/* agent-mascot v1 · '+SRC_KB+' KB, no dependencies · full source is included when you copy */')+sp('t','<\/script>')+'\n'+hTag()
    : sp('t','<script')+' '+sp('a','src')+'='+sp('s','"agent-mascot.js"')+sp('t','><\/script>')+'\n'+hTag();
  $('snipNote').hidden = tab!=='file';
  $('embedPrev').setConfig({shape:state.shape,color:state.color,material:state.material,eyes:state.eyes,cheeks:state.cheeks,state:state.state});
  document.querySelectorAll('.tabs button').forEach(function(b){ var on=b.dataset.t===tab; b.classList.toggle('on',on); b.setAttribute('aria-selected',on?'true':'false'); });
}
$('apiCode').innerHTML=hJS(API); $('jsMeta').textContent=SRC_KB+' KB · works offline, no build step';
function openEmbed(){ modalOpen=true; lastFocus=document.activeElement; renderEmbed(); var mb=$('embedModal'); mb.classList.add('open'); mb.setAttribute('aria-hidden','false'); document.body.classList.add('lock'); setTimeout(function(){ $('embedClose').focus({preventScroll:true}); },30); }
function closeEmbed(){ if(!modalOpen) return; modalOpen=false; var mb=$('embedModal'); mb.classList.remove('open'); mb.setAttribute('aria-hidden','true'); document.body.classList.remove('lock'); if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true}); }
window.__embed.open=openEmbed; window.__embed.close=closeEmbed;
$('embedBtn').onclick=openEmbed; $('embedClose').onclick=closeEmbed;
$('embedModal').addEventListener('click',function(e){ if(e.target===this) closeEmbed(); });
document.addEventListener('keydown',function(e){ if(modalOpen && e.key==='Escape'){ e.preventDefault(); closeEmbed(); } },true);
document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ tab=b.dataset.t; renderEmbed(); }; });
function copyText(s){ if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(s).catch(fallback); return Promise.resolve(fallback()); function fallback(){ var ta=document.createElement('textarea'); ta.value=s; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); } finally { ta.remove(); } } }
document.querySelectorAll('.cp').forEach(function(b){ var tm; b.onclick=function(){ var txt = b.dataset.copy==='api' ? API : (tab==='single'?standalone():scriptTag()); window.__lastCopy=txt;
  copyText(txt).then(function(){ b.textContent='Copied'; b.classList.add('ok'); clearTimeout(tm); tm=setTimeout(function(){ b.textContent='Copy'; b.classList.remove('ok'); },1400); }); }; });
$('dlJs').onclick=function(){ download(new Blob([SRC],{type:'text/javascript'}),'agent-mascot.js'); };
// boot
readHash(); stage.setConfig(state); sync(); writeHash();
window.addEventListener('hashchange',function(){ readHash(); stage.setConfig(state); sync(); });
})();
